name: Nintendo 3DS

# Builds dist/3ds/gen1recomp.3dsx: LÖVE Potion (pinned, with
# ports/3ds/lovepotion-3ds.patch) built in devkitPro's devkitARM container,
# with the game fused onto it.  Download it from the run's artifacts.

on:
  workflow_dispatch:
  push:
    branches: [3ds-port]
    paths:
      - "ports/3ds/**"
      - "src/**"
      - "main.lua"
      - "conf.lua"
      - ".github/workflows/3ds.yml"

jobs:
  harness:
    name: Boot on the LÖVE Potion API mock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the 3DS boot harness
        run: ports/3ds/harness/run.sh 600

  bytecode:
    name: Precompile Lua for the 3DS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 32-bit compiler for luac
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-multilib
      - name: Compile and verify bytecode
        run: ports/3ds/precompile.sh .bazinga/3ds/bytecode
      - uses: actions/upload-artifact@v4
        with:
          name: lua-bytecode
          path: .bazinga/3ds/bytecode
          include-hidden-files: true

  build:
    name: Build gen1recomp.3dsx
    needs: [harness, bytecode]
    runs-on: ubuntu-latest
    container:
      image: docker://devkitpro/devkitarm
      options: --cpus 2
    steps:
      - uses: actions/checkout@v4
      - name: Tools for packing
        run: apt-get update -qq && apt-get install -y -qq zip unzip git python3
      - uses: actions/download-artifact@v4
        with:
          name: lua-bytecode
          path: .bazinga/3ds/bytecode
      - name: Build patched LÖVE Potion and fuse the game
        run: |
          git config --global --add safe.directory '*'
          ports/3ds/build.sh --bytecode .bazinga/3ds/bytecode
      - name: Decode crash dumps from ports/3ds/crashdumps
        if: hashFiles('ports/3ds/crashdumps/*.dmp') != ''
        run: |
          elf="$(find .bazinga/3ds/lovepotion/build -name '*.elf' -print -quit)"
          cp "$elf" dist/3ds/lovepotion-patched.elf
          for dmp in ports/3ds/crashdumps/*.dmp; do
            out="$(python3 ports/3ds/symbolize.py "$dmp" "$elf" \
              --addr2line "$DEVKITARM/bin/arm-none-eabi-addr2line" \
              --objdump "$DEVKITARM/bin/arm-none-eabi-objdump" 2>&1)"
            printf '### %s\n```\n%s\n```\n' "$dmp" "$out" >> "$GITHUB_STEP_SUMMARY"
            enc="$(printf '%s' "$out" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::warning title=Crash dump $(basename "$dmp")::$enc"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: gen1recomp-3ds
          path: |
            dist/3ds/gen1recomp.3dsx
            dist/3ds/lovepotion-patched.3dsx
            dist/3ds/lovepotion-patched.elf
